<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ShadowAssistant</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="/css/themes.css" />
    <link rel="stylesheet" href="/css/ai.css" />
    <link rel="icon" href="assets/imgs/icons/pages/ai.png" type="image/x-icon" />
  </head>

  <body>
    <div class="ai-layout">

      <!-- Sidebar -->
      <aside class="chat-sidebar">

        <div class="sidebar-header">
          <div class="brand-lockup">
            <span class="brand-mark">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                   stroke-linecap="round" stroke-linejoin="round" width="16" height="16">
                <path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/>
              </svg>
            </span>
            <div>
              <h2>Shadow AI</h2>
              <p>Your personal assistant</p>
            </div>
          </div>
          <button id="new-chat-btn" class="new-chat-btn" title="New chat">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                 stroke-linecap="round" stroke-linejoin="round" width="15" height="15">
              <path d="M12 20h9"/><path d="M16.5 3.5a2.121 2.121 0 013 3L7 19l-4 1 1-4 12.5-12.5z"/>
            </svg>
          </button>
        </div>

        <div class="chat-search">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
               stroke-linecap="round" stroke-linejoin="round" width="14" height="14" class="search-icon">
            <circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/>
          </svg>
          <input id="chat-search-input" type="text" placeholder="Search chats…" />
        </div>

        <div class="sidebar-section-label">Today</div>
        <div id="chat-list" class="chat-list"></div>

        <div class="sidebar-footer">
          <span class="model-label">Model</span>
          <select id="model-selector">
            <option value="gpt-5.4-mini" selected>GPT-5.4 Mini (Default)</option>
            <option value="gpt-5.4">GPT-5.4</option>
            <option value="claude-sonnet-4.6">Claude Sonnet 4.6</option>
            <option value="gemini-3-flash-preview">Gemini 3 Flash Preview</option>
          </select>
        </div>
      </aside>

      <!-- Main -->
      <main class="chat-main">

        <div class="topbar">
          <div class="topbar-copy">
            <h1>New chat</h1>
            <p>powered by <a href="https://api.navy/docs" target="_blank">Navy AI</a></p>
          </div>
          <div class="topbar-actions">
            <span id="screen-share-status" class="screen-share-status"></span>
            <button id="screen-share-btn" class="screen-share-btn" type="button">Share screen</button>
          </div>
        </div>

        <div class="messages">
          <div id="welcome-panel" class="welcome-panel">
            <h2>What can I help<br>you with today?</h2>
            <div class="welcome-grid">

              <button class="welcome-card" data-prompt="Help me create a Discord bot in Python that responds to commands and has a fun /joke command">
                <span class="welcome-card-title">Create a Discord bot</span>
                <span class="welcome-card-subtitle">with slash commands in Python</span>
              </button>

              <button class="welcome-card" data-prompt="Help me with my homework — I'll paste the question and you can walk me through it step by step">
                <span class="welcome-card-title">Help me with homework</span>
                <span class="welcome-card-subtitle">step-by-step explanations</span>
              </button>

              <button class="welcome-card" data-prompt="Fix the bug in my code — I'll paste it and describe what's going wrong">
                <span class="welcome-card-title">Debug my code</span>
                <span class="welcome-card-subtitle">paste it and I'll find the issue</span>
              </button>

              <button class="welcome-card" data-prompt="Write a message I can send to my friend apologizing for missing their party last weekend">
                <span class="welcome-card-title">Write a message for me</span>
                <span class="welcome-card-subtitle">apology, text, email — anything</span>
              </button>

            </div>
          </div>
        </div>

        <!-- Composer -->
        <div class="composer-shell">
          <div id="attachment-tray" class="attachment-tray" hidden></div>

          <div class="input-container">
            <textarea placeholder="Ask me anything…" rows="1"></textarea>

            <div class="composer-icon-row">
              <button class="composer-icon-btn" id="upload-image-btn" title="Upload image" type="button">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"
                     stroke-linecap="round" stroke-linejoin="round" width="18" height="18">
                  <rect x="3" y="3" width="18" height="18" rx="2"/>
                  <circle cx="8.5" cy="8.5" r="1.5"/>
                  <polyline points="21 15 16 10 5 21"/>
                </svg>
              </button>
              <input type="file" id="image-picker" accept="image/*" multiple />

              <button class="send-btn" type="button" title="Send">
                <svg viewBox="0 0 24 24"><path d="M2.01 21L23 12 2.01 3 2 10l15 2-15 2z"/></svg>
              </button>
            </div>
          </div>

          <p class="composer-note">Shadow AI can make mistakes. Please verify important info.</p>
        </div>

      </main>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <script>
      const ta = document.querySelector('.input-container textarea');
      ta.addEventListener('input', () => {
        ta.style.height = 'auto';
        ta.style.height = Math.min(ta.scrollHeight, 160) + 'px';
      });

      document.onclick = (e) => {
        if (e.target.id !== '__shadow-search-bar')
          parent.postMessage('hide-suggestions', '*');
      };
    </script>
    <script src="/assets/js/themes.js" type="module"></script>
    <script src="/assets/js/ai.js" type="module"></script>
  </body>
</html>
