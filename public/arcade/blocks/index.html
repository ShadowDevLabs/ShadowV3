<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>Blocks</title>
<style>
  * { box-sizing:border-box; margin:0; padding:0; -webkit-user-select:none; user-select:none; }
  html,body { height:100%; }
  body { background:#0b0e17; color:#e8ecf7; font-family:system-ui,sans-serif; display:flex; flex-direction:column;
    align-items:center; justify-content:center; gap:12px; min-height:100%; touch-action:none; }
  h1 { font-size:24px; letter-spacing:2px; }
  .wrap { display:flex; gap:16px; align-items:flex-start; }
  canvas { background:#0f1522; border:1px solid #1e2740; border-radius:8px; }
  .side { display:flex; flex-direction:column; gap:12px; font-size:14px; color:#9aa6c4; }
  .side b { color:#e8ecf7; font-size:20px; display:block; }
  button { background:#8b5cf6; color:#fff; border:0; border-radius:8px; padding:9px 14px; font-weight:600; cursor:pointer; }
  .hint { color:#6b7696; font-size:12px; max-width:180px; line-height:1.5; }
</style>
</head>
<body>
  <h1>BLOCKS</h1>
  <div class="wrap">
    <canvas id="c" width="240" height="480"></canvas>
    <div class="side">
      <div>Score<b id="score">0</b></div>
      <div>Lines<b id="lines">0</b></div>
      <div>Next<canvas id="next" width="96" height="96" style="margin-top:4px;background:#0f1522;border-radius:6px"></canvas></div>
      <button onclick="restart()">New Game</button>
      <div class="hint">← → move · ↑ rotate · ↓ soft drop · space hard drop</div>
    </div>
  </div>
<script>
const cv=document.getElementById("c"), ctx=cv.getContext("2d");
const nx=document.getElementById("next"), nctx=nx.getContext("2d");
const COLS=10, ROWS=20, S=24;
const SHAPES={
  I:[[1,1,1,1]], O:[[1,1],[1,1]], T:[[0,1,0],[1,1,1]], S:[[0,1,1],[1,1,0]],
  Z:[[1,1,0],[0,1,1]], J:[[1,0,0],[1,1,1]], L:[[0,0,1],[1,1,1]] };
const COLORS={I:"#22d3ee",O:"#facc15",T:"#a78bfa",S:"#4ade80",Z:"#f87171",J:"#60a5fa",L:"#fb923c"};
let board,cur,nextP,score,lines,dropTimer,gameOver,fallMs;
function emptyBoard(){ return Array.from({length:ROWS},()=>Array(COLS).fill("")); }
function randPiece(){ const k=Object.keys(SHAPES); const t=k[Math.random()*k.length|0];
  return {t,m:SHAPES[t].map(r=>r.slice()),x:(COLS>>1)-1,y:0}; }
function rotate(m){ return m[0].map((_,i)=>m.map(r=>r[i]).reverse()); }
function collide(p,m=p.m,x=p.x,y=p.y){ for(let r=0;r<m.length;r++)for(let c=0;c<m[r].length;c++){
  if(!m[r][c]) continue; const nx=x+c, ny=y+r;
  if(nx<0||nx>=COLS||ny>=ROWS) return true; if(ny>=0&&board[ny][nx]) return true; } return false; }
function merge(p){ p.m.forEach((row,r)=>row.forEach((v,c)=>{ if(v&&p.y+r>=0) board[p.y+r][p.x+c]=p.t; })); }
function clearLines(){ let n=0; for(let r=ROWS-1;r>=0;r--){ if(board[r].every(v=>v)){ board.splice(r,1); board.unshift(Array(COLS).fill("")); n++; r++; } }
  if(n){ lines+=n; score+=[0,100,300,500,800][n]; fallMs=Math.max(120,500-lines*8);
    document.getElementById("lines").textContent=lines; document.getElementById("score").textContent=score; } }
function spawn(){ cur=nextP||randPiece(); nextP=randPiece(); drawNext();
  if(collide(cur)){ gameOver=true; } }
function drop(){ if(gameOver) return; if(!collide(cur,cur.m,cur.x,cur.y+1)) cur.y++;
  else { merge(cur); clearLines(); spawn(); } draw(); }
function hardDrop(){ while(!collide(cur,cur.m,cur.x,cur.y+1)){ cur.y++; score+=2; } drop();
  document.getElementById("score").textContent=score; }
function move(dx){ if(!collide(cur,cur.m,cur.x+dx,cur.y)) cur.x+=dx, draw(); }
function rot(){ const m=rotate(cur.m); for(const k of [0,-1,1,-2,2]){ if(!collide(cur,m,cur.x+k,cur.y)){ cur.m=m; cur.x+=k; draw(); return; } } }
function cell(c,x,y,sz){ c.fillStyle="#0b0e17"; c.fillRect(x*sz,y*sz,sz,sz); }
function block(c,x,y,color,sz){ c.fillStyle=color; c.fillRect(x*sz+1,y*sz+1,sz-2,sz-2);
  c.fillStyle="rgba(255,255,255,.18)"; c.fillRect(x*sz+1,y*sz+1,sz-2,4); }
function draw(){ ctx.fillStyle="#0f1522"; ctx.fillRect(0,0,cv.width,cv.height);
  for(let r=0;r<ROWS;r++)for(let c=0;c<COLS;c++) if(board[r][c]) block(ctx,c,r,COLORS[board[r][c]],S);
  if(cur&&!gameOver) cur.m.forEach((row,r)=>row.forEach((v,c)=>{ if(v) block(ctx,cur.x+c,cur.y+r,COLORS[cur.t],S); }));
  if(gameOver){ ctx.fillStyle="rgba(11,14,23,.8)"; ctx.fillRect(0,0,cv.width,cv.height);
    ctx.fillStyle="#fff"; ctx.textAlign="center"; ctx.font="bold 22px system-ui"; ctx.fillText("Game Over",cv.width/2,cv.height/2); } }
function drawNext(){ nctx.fillStyle="#0f1522"; nctx.fillRect(0,0,nx.width,nx.height); const m=nextP.m;
  const ox=(4-m[0].length)/2, oy=(4-m.length)/2; m.forEach((row,r)=>row.forEach((v,c)=>{ if(v) block(nctx,ox+c,oy+r,COLORS[nextP.t],24); })); }
function restart(){ board=emptyBoard(); score=0; lines=0; fallMs=500; gameOver=false; nextP=null; spawn();
  document.getElementById("score").textContent=0; document.getElementById("lines").textContent=0; draw(); }
addEventListener("keydown",e=>{ if(gameOver) return; const k=e.key;
  if(k==="ArrowLeft"){ e.preventDefault(); move(-1); } else if(k==="ArrowRight"){ e.preventDefault(); move(1); }
  else if(k==="ArrowDown"){ e.preventDefault(); drop(); score++; document.getElementById("score").textContent=score; }
  else if(k==="ArrowUp"){ e.preventDefault(); rot(); } else if(k===" "){ e.preventDefault(); hardDrop(); } });
let sx,sy,moved;
cv.addEventListener("touchstart",e=>{ sx=e.touches[0].clientX; sy=e.touches[0].clientY; moved=false; },{passive:true});
cv.addEventListener("touchmove",e=>{ const dx=e.touches[0].clientX-sx, dy=e.touches[0].clientY-sy;
  if(Math.abs(dx)>24){ move(dx>0?1:-1); sx=e.touches[0].clientX; moved=true; }
  if(dy>28){ drop(); sy=e.touches[0].clientY; moved=true; } },{passive:true});
cv.addEventListener("touchend",()=>{ if(!moved) rot(); });
restart();
// Single gravity driver: advance one row every fallMs, pausing while game over.
let acc=0, prev=performance.now();
(function fall(now){ acc+=now-prev; prev=now;
  if(!gameOver && acc>=fallMs){ acc=0; drop(); } requestAnimationFrame(fall); })(performance.now());
</script>
</body>
</html>
