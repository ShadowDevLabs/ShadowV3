<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>Minefield</title>
<style>
  * { box-sizing:border-box; margin:0; padding:0; -webkit-user-select:none; user-select:none; }
  html,body { height:100%; }
  body { background:#0b0e17; color:#e8ecf7; font-family:system-ui,sans-serif; display:flex; flex-direction:column;
    align-items:center; justify-content:center; gap:12px; min-height:100%; }
  h1 { font-size:24px; letter-spacing:1px; }
  .row { display:flex; gap:14px; align-items:center; font-size:15px; color:#9aa6c4; } .row b { color:#e8ecf7; }
  select,button { background:#1b2133; color:#e8ecf7; border:1px solid #2a3350; border-radius:7px; padding:7px 12px; font-size:14px; cursor:pointer; }
  button.new { background:#3b82f6; border-color:#3b82f6; color:#fff; font-weight:600; }
  #grid { display:grid; gap:3px; background:#1b2133; padding:8px; border-radius:10px; }
  .cell { width:30px; height:30px; display:flex; align-items:center; justify-content:center; font-weight:800; font-size:15px;
    background:#2b3450; border-radius:4px; cursor:pointer; }
  .cell.open { background:#141a28; cursor:default; }
  .cell.mine { background:#ef4444; }
  .cell.flag { background:#f59e0b; }
  .hint { color:#6b7696; font-size:13px; }
  .c1{color:#60a5fa}.c2{color:#34d399}.c3{color:#f87171}.c4{color:#a78bfa}.c5{color:#fb923c}.c6{color:#22d3ee}.c7{color:#f472b6}.c8{color:#cbd5e1}
</style>
</head>
<body>
  <h1>💣 MINEFIELD</h1>
  <div class="row">
    <span>Mines <b id="mines">0</b></span>
    <select id="diff" onchange="newGame()">
      <option value="9,10">Easy · 9×9</option>
      <option value="12,25">Medium · 12×12</option>
      <option value="16,45">Hard · 16×16</option>
    </select>
    <button class="new" onclick="newGame()">New</button>
    <span id="status"></span>
  </div>
  <div id="grid"></div>
  <div class="hint">Left-click reveal · right-click / long-press to flag</div>
<script>
let size, mineCount, cells, over, revealed, firstClick;
const gridEl=document.getElementById("grid");
function newGame(){ const [s,m]=document.getElementById("diff").value.split(",").map(Number);
  size=s; mineCount=m; over=false; revealed=0; firstClick=true;
  cells=Array.from({length:s*s},()=>({mine:false,open:false,flag:false,n:0}));
  document.getElementById("mines").textContent=m; document.getElementById("status").textContent="";
  gridEl.style.gridTemplateColumns=`repeat(${s},30px)`; render(); }
function idx(r,c){ return r*size+c; }
function neighbors(i){ const r=(i/size)|0, c=i%size, out=[];
  for(let dr=-1;dr<=1;dr++)for(let dc=-1;dc<=1;dc++){ if(!dr&&!dc) continue; const nr=r+dr,nc=c+dc;
    if(nr>=0&&nr<size&&nc>=0&&nc<size) out.push(idx(nr,nc)); } return out; }
function placeMines(safe){ const pool=[...cells.keys()].filter(i=>i!==safe&&!neighbors(safe).includes(i));
  for(let k=0;k<mineCount;k++){ const j=Math.floor(Math.random()*pool.length); cells[pool[j]].mine=true; pool.splice(j,1); }
  cells.forEach((c,i)=>{ if(!c.mine) c.n=neighbors(i).filter(n=>cells[n].mine).length; }); }
function open(i){ const c=cells[i]; if(over||c.open||c.flag) return;
  if(firstClick){ placeMines(i); firstClick=false; }
  c.open=true; revealed++;
  if(c.mine){ over=true; cells.forEach(x=>{ if(x.mine) x.open=true; }); render();
    document.getElementById("status").textContent="💥 Boom!"; return; }
  if(c.n===0) neighbors(i).forEach(open);
  if(revealed===size*size-mineCount){ over=true; document.getElementById("status").textContent="🏆 Cleared!"; }
  render(); }
function flag(i,e){ e.preventDefault(); const c=cells[i]; if(over||c.open) return; c.flag=!c.flag; render(); }
function render(){ gridEl.innerHTML="";
  cells.forEach((c,i)=>{ const d=document.createElement("div"); d.className="cell";
    if(c.open){ d.classList.add("open"); if(c.mine){ d.classList.add("mine"); d.textContent="💣"; }
      else if(c.n){ d.textContent=c.n; d.classList.add("c"+c.n); } }
    else if(c.flag){ d.classList.add("flag"); d.textContent="🚩"; }
    d.oncontextmenu=e=>flag(i,e); d.onclick=()=>open(i);
    let lp; d.ontouchstart=()=>{ lp=setTimeout(()=>flag(i,{preventDefault(){}}),400); };
    d.ontouchend=()=>clearTimeout(lp);
    gridEl.appendChild(d); }); }
newGame();
</script>
</body>
</html>
