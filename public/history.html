<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>History</title>
  <link rel="stylesheet" href="/css/themes.css" />
  <script src="/assets/js/themes.js" type="module"></script>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">
  <link rel="icon" href="/pages/history.ico" type="image/x-icon" />
  <link href="/css/history.css" rel="stylesheet">
  <link href="/css/features.css" rel="stylesheet">
</head>

<body class="list-page">

  <div class="container">
    <div class="header">
      <h1>History</h1>
      <div class="header-actions">
        <label class="inline-toggle" title="Fold each day's visits to the same site into one group">
          <input type="checkbox" id="groupBySite" /> Group by site
        </label>
        <button class="deleteBtn" id="deleteBtn">Clear History</button>
        <input type="search" class="searchBar" id="searchBar" placeholder="Search History" autocomplete="off">
      </div>
    </div>

    <p class="muted" id="status"></p>
    <div id="historyEntries"></div>
    <button class="deleteBtn" id="showMore" hidden>Show more</button>
  </div>
  <script src="/assets/js/history.js" type="module"></script>
</body>

</html>
